[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "actions-scan"
version = "0.1.0"
description = "Inventory GitHub Actions references across an organization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
    "requests==2.33.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "responses==0.25.8",
]

[project.scripts]
actions-scan = "actions_scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
